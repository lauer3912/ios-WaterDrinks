name: WaterDrinks
options:
  bundleIdPrefix: com.ggsheng
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9L6N2ZF26B
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  WaterDrinks:
    type: application
    platform: iOS
    sources:
      - path: WaterDrinks
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: WaterDrinks/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.WaterDrinks
        PRODUCT_NAME: WaterDrinks
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: WaterDrinks/WaterDrinks.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: 9L6N2ZF26B
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
    entitlements:
      path: WaterDrinks/WaterDrinks.entitlements
    dependencies:
      - target: WaterDrinksWidget
        embed: true

  WaterDrinksWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WaterDrinksWidget
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: WaterDrinksWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.WaterDrinks.widget
        PRODUCT_NAME: WaterDrinksWidget
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_ENTITLEMENTS: WaterDrinksWidget/WaterDrinksWidget.entitlements
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: 9L6N2ZF26B
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: YES
    entitlements:
      path: WaterDrinksWidget/WaterDrinksWidget.entitlements

  WaterDrinksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WaterDrinksTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: WaterDrinks
    settings:
      base:
        INFOPLIST_FILE: WaterDrinksTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.WaterDrinksTests
        PRODUCT_NAME: WaterDrinksTests
        GENERATE_INFOPLIST_FILE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WaterDrinks.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WaterDrinks"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B

  WaterDrinksUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WaterDrinksUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: WaterDrinks
    settings:
      base:
        INFOPLIST_FILE: WaterDrinksUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ggsheng.WaterDrinksUITests
        PRODUCT_NAME: WaterDrinksUITests
        GENERATE_INFOPLIST_FILE: NO
        TEST_TARGET: "$(BUILT_PRODUCTS_DIR)/WaterDrinks.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WaterDrinks"
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9L6N2ZF26B

schemes:
  WaterDrinks:
    build:
      targets:
        WaterDrinks: all
        WaterDrinksWidget: all
        WaterDrinksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WaterDrinksUITests
    archive:
      config: Release